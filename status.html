<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<div class="krs-status-root" data-krs-panel="true">
  <div class="krs-board">
    
    <!-- 🌟 顶部导航栏 -->
    <div class="krs-top-nav-bar">
      <div class="krs-nav-tabs">
        <button type="button" class="krs-nav-tab active" data-tab="hero">
          <span class="tab-icon">⚔️</span>
          <span class="tab-text">核心</span>
        </button>
        <button type="button" class="krs-nav-tab" data-tab="relations">
          <span class="tab-icon">👥</span>
          <span class="tab-text">关系</span>
          <span class="krs-nav-badge char-count-badge">0</span>
        </button>
        <button type="button" class="krs-nav-tab" data-tab="destiny">
          <span class="tab-icon">🧭</span>
          <span class="tab-text">命运</span>
          <span class="krs-nav-badge event-count-badge">0</span>
        </button>
        <button type="button" class="krs-nav-tab" data-tab="assets">
          <span class="tab-icon">🏛️</span>
          <span class="tab-text">资产</span>
          <span class="krs-nav-badge asset-count-badge">0</span>
        </button>
        <button type="button" class="krs-nav-tab" data-tab="map">
          <span class="tab-icon">🗺️</span>
          <span class="tab-text">地图</span>
        </button>
        <button type="button" class="krs-nav-tab" data-tab="crisis">
          <span class="tab-icon">🌪️</span>
          <span class="tab-text">风云</span>
          <span class="krs-nav-badge crisis-count-badge">—</span>
        </button>
      </div>

      <!-- ⭐ 顶部时间 / 日期 / 天气（纯展示，不参与编辑模式；不显示星期） -->
      <div class="krs-datetime" id="krs-datetime">
        <span class="krs-dt-time" id="krs-dt-time">--:--</span>
        <span class="krs-dt-rule" aria-hidden="true"></span>
        <span class="krs-dt-sub">
          <span class="krs-dt-weather-icon" id="krs-dt-wicon" aria-hidden="true"></span>
          <span class="krs-dt-date" id="krs-dt-date">—</span>
          <span class="krs-dt-weather" id="krs-dt-weather"></span>
        </span>
      </div>

      <div class="krs-nav-actions">
        <button type="button" class="krs-pill edit-toggle-btn" title="开关变量编辑模式">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button type="button" class="krs-pill cg-hub-btn" title="查看画册">
          <span>📷 相册</span>
        </button>
        <button type="button" class="krs-collapse-btn" id="krs-btn-collapse" title="折叠/展开状态栏">
          <span class="krs-collapse-text">收起</span>
          <span class="krs-collapse-icon">▲</span>
        </button>
      </div>
    </div>

    <!-- 🌟 内容视口舞台（固定视口 510px） -->
    <div class="krs-stage-container">
      
      <!-- ================= 页面 1：主角专属【核心 / 技能】 ================= -->
      <div class="krs-tab-pane active" id="pane-hero">
        <div class="krs-pane-scroll-inner hero-split-layout">
          
          <div class="krs-user-mode-card">
            <div class="krs-u-top-row">
              <div class="krs-u-left-pack">
                <div class="krs-u-avatar-box">
                  <img class="hero-avatar-img" src="" alt="主角">
                </div>
                <div class="krs-u-title-group">
                  <div class="krs-u-name-line">
                    <span class="krs-u-name hero-name-text" data-krs-edit="user.称呼" data-krs-label="主角称呼">--</span>
                    <span class="krs-u-identity hero-id-text" data-krs-edit="user.身份" data-krs-label="主角身份">--</span>
                  </div>
                  <div class="krs-u-badges">
                    <span class="krs-u-badge combat hero-combat-badge" data-krs-edit="user.战力水平" data-krs-label="主角战力水平 (0-8)" data-krs-type="number">⚔️ Lv.0</span>
                    <span class="krs-u-badge hero-view-badge">视点: --</span>
                    <span class="krs-u-badge hero-repute-badge" data-krs-edit="user.风评" data-krs-label="外界风评" data-krs-type="textarea">风评: --</span>
                  </div>
                </div>
              </div>

              <div class="krs-u-dash-pills">
                <div class="krs-dash-box">
                  <span class="krs-dash-title">💰 个人金库</span>
                  <span class="krs-dash-val gold hero-gold-text" data-krs-edit="user.金币" data-krs-label="个人金币" data-krs-type="number">0 G</span>
                </div>
                <div class="krs-dash-box">
                  <span class="krs-dash-title">🌌 因果律刻印</span>
                  <span class="krs-dash-val purple hero-causality-text">Lv.1 (5层)</span>
                </div>
                <div class="krs-dash-box">
                  <span class="krs-dash-title">📍 驻留地理</span>
                  <span class="krs-dash-val cyan hero-loc-text">--</span>
                </div>
              </div>
            </div>

            <div class="krs-u-gauges">
              <div class="krs-gauge-box" data-krs-edit="user.世界接纳度" data-krs-label="世界接纳度 (0-200)" data-krs-type="number">
                <div class="krs-gauge-top">
                  <span>世界接纳度</span>
                  <span class="krs-gauge-stage hero-accept-num">0/200</span>
                </div>
                <div class="krs-gauge-track">
                  <div class="krs-gauge-fill hero-accept-bar" style="width: 0%; background: linear-gradient(90deg, #0d9488, #2dd4bf);"></div>
                </div>
              </div>

              <div class="krs-gauge-box" data-krs-edit="user.淫乱度" data-krs-label="身心异变 / 淫乱度 (0-200)" data-krs-type="number">
                <div class="krs-gauge-top">
                  <span>身心异变 / 淫乱度</span>
                  <span class="krs-gauge-stage hero-lust-stage">0 - 抵抗</span>
                </div>
                <div class="krs-gauge-track">
                  <div class="krs-gauge-fill hero-lust-bar" style="width: 0%;"></div>
                </div>
              </div>
            </div>

            <div class="krs-u-meta-rows">
              <div class="krs-u-row"><span>当前状态</span><span class="hero-status-text" data-krs-edit="user.状态" data-krs-label="主角状态" data-krs-type="textarea">--</span></div>
              <div class="krs-u-row"><span>身着服装</span><span class="hero-dress-text" data-krs-edit="user.服装" data-krs-label="主角服装" data-krs-type="textarea">--</span></div>
            </div>
            
            <div class="hero-warn-slot"></div>
          </div>

          <div class="krs-ability-block">
            <div class="krs-sub-sec-head">
              <span class="sec-title">📖 本领与特质修持 (主角专属)</span>
              <span class="sec-sub">特性特质 · 流派大方块矩阵</span>
            </div>
            
            <div class="krs-traits-wrapper">
              <div class="krs-traits-sub-title">✦ 身心固有特性 / 加护与诅咒</div>
              <div class="hero-traits-container"></div>
            </div>

            <div class="hero-skills-grouped-container krs-grouped-skills-scroll-area"></div>
          </div>
        </div>
      </div>

      <!-- ================= 页面 2：角色专属【关系 / 羁绊】 ================= -->
      <div class="krs-tab-pane" id="pane-relations">
        <div class="krs-pane-scroll-inner krs-relations-layout">
          <div class="krs-char-slider-wrap">
            <div class="krs-char-slider-track" id="relations-char-slider"></div>
          </div>

          <div class="krs-char-detail-stage" id="relations-char-stage"></div>
        </div>
      </div>

      <!-- ================= 页面 3：【命途 / 纪事】 ================= -->
      <div class="krs-tab-pane" id="pane-destiny">
        <div class="krs-pane-scroll-inner krs-destiny-view" id="destiny-stage"></div>
      </div>

      <!-- ================= 页面 3.5：【世界风云】 ================= -->
      <div class="krs-tab-pane" id="pane-crisis">
        <div class="krs-pane-scroll-inner" id="crisis-stage"></div>
      </div>

      <!-- ================= 页面 4：【家产 / 领地】 ================= -->
      <div class="krs-tab-pane" id="pane-assets">
        <div class="krs-pane-scroll-inner krs-relations-layout">
          <!-- 🌟 四大资产大类过滤器 -->
          <div class="krs-asset-cat-nav" id="assets-category-bar"></div>

          <!-- 🌟 资产水平轮播选择滑轨 -->
          <div class="krs-char-slider-wrap">
            <div class="krs-char-slider-track" id="assets-slider"></div>
          </div>
          <!-- 🌟 选中资产的主展示大舞台 -->
          <div class="krs-assets-detail-stage" id="assets-stage"></div>
        </div>
      </div>

      <!-- ================= 页面 5：【地图 / 疆域】 ================= -->
      <div class="krs-tab-pane" id="pane-map">
        <div class="pdr-embedded-map-container">
          <div class="pdr-map-viewport" id="pdr-viewport">
            <div class="pdr-map-canvas" id="pdr-canvas">
              <div class="pdr-factions-layer" id="pdr-factions-layer"></div>
              <svg class="pdr-map-svg" id="pdr-svg-lines"></svg>
              <div class="pdr-map-nodes" id="pdr-nodes-layer"></div>
            </div>

            <div class="pdr-map-controls">
              <button type="button" class="pdr-ctrl-btn" id="pdr-zoom-in" title="放大视野">+</button>
              <button type="button" class="pdr-ctrl-btn" id="pdr-zoom-out" title="缩小视野">-</button>
              <button type="button" class="pdr-ctrl-btn" id="pdr-zoom-reset" title="复位至帝国中枢">⟲</button>
            </div>

            <div class="pdr-location-drawer" id="pdr-drawer">
              <div class="pdr-drawer-left">
                <div class="pdr-dl-head">
                  <span class="pdr-dl-name" id="pdr-info-name">王都</span>
                  <span class="pdr-dl-nation" id="pdr-info-nation">埃斯特拉德尔帝国</span>
                  <span class="pdr-dl-type" id="pdr-info-type">帝国中枢</span>
                </div>
                <div class="pdr-dl-desc" id="pdr-info-desc">帝国的全境中心，皇室与元老院所在。</div>
                <div class="pdr-dl-subplaces" id="pdr-info-subs"></div>
              </div>
              <div class="pdr-drawer-right">
                <div class="pdr-dr-stat">
                  <span>通行耗时</span>
                  <strong id="pdr-info-cost">中心原点</strong>
                </div>
                <button type="button" class="pdr-btn-relocate" id="pdr-btn-set-loc">📍 定锚移动至此</button>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
.mes:has(.krs-status-root),
.mes_text:has(.krs-status-root),
.mes_block:has(.krs-status-root) {
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  padding: 2px !important;
  max-height: none !important;
  height: auto !important;
  overflow: visible !important;
}
.mes:has(.krs-status-root) > .avatar,
.mes:has(.krs-status-root) .avatar,
.mes:has(.krs-status-root) .ch_name {
  display: none !important;
}

.krs-status-root {
  --theme-main: #e6b85c;
  --theme-sub: #ffe89e;
  --theme-rgb: 230, 184, 92;

  --panel-bg: rgba(18, 14, 28, 0.7);
  --card-bg: rgba(26, 20, 38, 0.6);
  --card-bg-hover: rgba(38, 30, 56, 0.8);
  --glass-border: rgba(255, 255, 255, 0.1);

  --font-bright: #ffffff;
  --font-normal: #ded8e8;
  --font-muted: #9f96ad;

  width: 100%;
  max-width: 930px;
  margin: 6px auto;
  color: var(--font-normal);
  font-family: "Noto Serif SC", "Source Han Serif SC", "PingFang SC", "Microsoft YaHei", serif;
  user-select: none;
  box-sizing: border-box;
  position: relative;
}
.krs-status-root * { box-sizing: border-box; margin: 0; padding: 0; }

.krs-status-root .krs-board {
  background: linear-gradient(180deg, 
    rgba(25, 20, 40, 0.75) 0%, 
    rgba(16, 12, 26, 0.65) 55%, 
    rgba(10, 8, 16, 0.8) 100%
  ) !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 20px;
  box-shadow: 0 16px 45px rgba(0, 0, 0, 0.55);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
}

.krs-stage-container {
  height: 510px;
  max-height: 510px;
  width: 100%;
  position: relative;
  overflow: hidden;
}

.krs-status-root.krs-collapsed .krs-stage-container { display: none !important; }
.krs-status-root.krs-collapsed .krs-board { padding: 10px 16px !important; }

.krs-pane-scroll-inner {
  height: 100%;
  max-height: 510px;
  overflow-y: auto;
  overflow-x: hidden;
  padding-right: 4px;
  scrollbar-width: thin;
  scrollbar-color: rgba(var(--theme-rgb), 0.45) transparent;
}
.krs-pane-scroll-inner::-webkit-scrollbar { width: 4.5px; }
.krs-pane-scroll-inner::-webkit-scrollbar-thumb {
  background: rgba(var(--theme-rgb), 0.45);
  border-radius: 4px;
}

.krs-status-root .krs-top-nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding-bottom: 10px;
  gap: 8px;
  flex-wrap: wrap;
}
.krs-status-root .krs-nav-tabs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.krs-status-root .krs-nav-tab {
  background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px; padding: 4px 9px; color: var(--font-muted); font-size: 11.5px; font-weight: 700;
  cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.25s ease;
}
.krs-status-root .krs-nav-tab:hover { background: rgba(255, 255, 255, 0.12); color: #fff; transform: translateY(-1px); }
.krs-status-root .krs-nav-tab.active {
  background: linear-gradient(135deg, rgba(var(--theme-rgb), 0.3) 0%, rgba(30, 24, 45, 0.8) 100%);
  border-color: var(--theme-main); color: var(--theme-sub); box-shadow: 0 0 14px rgba(var(--theme-rgb), 0.35);
}
.krs-status-root .krs-nav-badge {
  background: rgba(0, 0, 0, 0.4); border-radius: 10px; padding: 0.5px 5px; font-size: 9.5px; color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.1);
}
.krs-status-root .tab-icon { font-size: 12px; }

/* ⭐ 顶部时间 / 日期 / 天气（上：时间，下：图标+日期+天气，中间一条细线分隔） */
.krs-status-root .krs-datetime {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; margin: 0 10px; min-width: 128px; line-height: 1.15;
  pointer-events: none; user-select: none;
}
.krs-status-root .krs-dt-time {
  font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--theme-sub); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
}
.krs-status-root .krs-dt-rule {
  display: block; width: 100%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(var(--theme-rgb), 0.6), transparent);
}
.krs-status-root .krs-dt-sub {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 10.5px; color: rgba(230, 232, 240, 0.82); white-space: nowrap;
}
.krs-status-root .krs-dt-weather-icon { display: inline-flex; width: 13px; height: 13px; color: var(--theme-sub); }
.krs-status-root .krs-dt-weather-icon svg { width: 13px; height: 13px; display: block; }
.krs-status-root .krs-dt-weather { color: rgba(200, 205, 220, 0.9); }
.krs-status-root .krs-dt-weather:empty { display: none; }
.krs-status-root .krs-editing .krs-datetime { opacity: 0.55; }

.krs-status-root .krs-nav-actions { display: flex; align-items: center; gap: 6px; }
.krs-status-root .krs-pill {
  font-size: 11px; padding: 4px 10px; border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.06);
  color: #ded8e8; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  transition: all 0.2s ease;
}
.krs-status-root .krs-pill:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }
.krs-status-root.krs-editing .krs-pill.edit-toggle-btn {
  background: rgba(45, 212, 191, 0.25) !important;
  border-color: #2dd4bf !important;
  color: #2dd4bf !important;
  box-shadow: 0 0 10px rgba(45, 212, 191, 0.4) !important;
}
.krs-status-root .krs-collapse-btn {
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
  color: #ded8e8; border-radius: 8px; padding: 4px 10px; font-size: 11.5px;
  cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
}

.krs-status-root .krs-tab-pane { display: none; width: 100%; height: 100%; }
.krs-status-root .krs-tab-pane.active { display: block; animation: krsTabFade 0.25s ease both; }
@keyframes krsTabFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

/* ================= 1. 主角核心卡 ================= */
.hero-split-layout { display: flex; flex-direction: column; gap: 12px; }
.krs-user-mode-card {
  background: var(--card-bg); border: 1px solid rgba(var(--theme-rgb), 0.35);
  border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
}
.krs-u-top-row {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 8px; gap: 10px; flex-wrap: wrap;
}
.krs-u-left-pack { display: flex; align-items: center; gap: 12px; min-width: 0; }
.krs-u-avatar-box {
  width: 64px; height: 64px; border-radius: 14px; overflow: hidden; flex-shrink: 0;
  border: 2px solid var(--theme-main); box-shadow: 0 0 12px rgba(var(--theme-rgb), 0.35);
}
.krs-u-avatar-box img { width: 100%; height: 100%; object-fit: cover; }
.krs-u-title-group { display: flex; flex-direction: column; gap: 2px; }
.krs-u-name-line { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.krs-u-name { font-size: 19px; font-weight: 900; color: #fff; }
.krs-u-identity { font-size: 12px; color: var(--theme-sub); }
.krs-u-badges { display: flex; gap: 5px; flex-wrap: wrap; }
.krs-u-badge {
  font-size: 10px; padding: 2px 7px; border-radius: 6px;
  background: rgba(230, 184, 92, 0.15); border: 1px solid rgba(230, 184, 92, 0.3); color: #f5e4be;
}
.krs-u-badge.combat { background: rgba(192, 132, 252, 0.15); border-color: rgba(192, 132, 252, 0.4); color: #e9d5ff; font-weight: 600; }

.krs-u-dash-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.krs-dash-box {
  background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px; padding: 5px 9px; display: flex; flex-direction: column; gap: 1px;
}
.krs-dash-title { font-size: 9.5px; color: var(--font-muted); }
.krs-dash-val { font-size: 13.5px; font-weight: 700; color: #fff; }
.krs-dash-val.gold { color: #e6b85c; }
.krs-dash-val.purple { color: #c084fc; }
.krs-dash-val.cyan { color: #38bdf8; }

.krs-u-gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.krs-gauge-box {
  background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px; padding: 6px 12px; display: flex; flex-direction: column; gap: 4px;
}
.krs-gauge-top { display: flex; justify-content: space-between; font-size: 11px; }
.krs-gauge-track { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; }
.krs-gauge-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }

.krs-u-meta-rows {
  display: flex; flex-direction: column; gap: 4px; font-size: 11.5px;
  background: rgba(0, 0, 0, 0.2); padding: 7px 12px; border-radius: 8px;
}
.krs-u-row { display: flex; gap: 8px; }
.krs-u-row span:first-child { color: var(--font-muted); flex-shrink: 0; min-width: 32px; }
.krs-u-row span:last-child { color: var(--font-normal); word-break: break-word; }

.krs-warn-tag {
  padding: 5px 10px; border-radius: 6px; background: rgba(186, 67, 75, 0.2);
  border-left: 3px solid #ba434b; color: #ffc2c5; font-size: 11px;
}
.krs-warn-tag b { color: #ff858d; margin-right: 4px; }

.krs-traits-wrapper {
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(0, 0, 0, 0.2); padding: 8px 10px; border-radius: 10px;
}
.krs-traits-sub-title {

.pdr-embedded-map-container {
  height: 100%; width: 100%; border-radius: 16px; overflow: hidden;
  border: 1px solid rgba(230, 184, 92, 0.35); position: relative;
}
.pdr-map-viewport {
  width: 100%; height: 100%; position: relative; overflow: hidden; cursor: grab;
  background-color: #0e101c; touch-action: none; user-select: none;
  background-image: radial-gradient(rgba(230, 184, 92, 0.06) 1.5px, transparent 1.5px);
  background-size: 40px 40px;
}
.pdr-map-viewport:active { cursor: grabbing; }
.pdr-map-canvas { position: absolute; top: 0; left: 0; width: 3200px; height: 2200px; transform-origin: 0 0; }

.pdr-factions-layer { position: absolute; inset: 0; pointer-events: none; }
.pdr-faction-zone {
  position: absolute; border-radius: 36px; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; padding-top: 18px; pointer-events: none;
}
.pdr-faction-watermark-cn { font-size: 26px; font-weight: 900; letter-spacing: 5px; opacity: 0.35; white-space: nowrap; }
.pdr-faction-watermark-en { font-size: 11px; font-weight: 700; letter-spacing: 2px; opacity: 0.22; text-transform: uppercase; }
.pdr-faction-dlc-tag {
  margin-top: 6px; font-size: 11px; font-weight: 700; background: rgba(14, 15, 26, 0.85);
  padding: 2px 12px; border-radius: 20px; border: 1px solid currentColor; opacity: 0.85;
}

.pdr-map-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
.pdr-map-svg line { stroke: rgba(147, 197, 253, 0.22); stroke-width: 1.5px; stroke-dasharray: 4, 4; }
.pdr-map-svg line.main-road { stroke: rgba(230, 184, 92, 0.45); stroke-width: 2.2px; stroke-dasharray: none; }
.pdr-map-svg line.sub-link { stroke: rgba(255, 255, 255, 0.18); stroke-width: 1.2px; stroke-dasharray: 2, 2; }
.pdr-map-svg line.isolated { stroke: rgba(168, 85, 247, 0.35); stroke-width: 1.5px; stroke-dasharray: 3, 5; }

.pdr-map-nodes { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.pdr-node { position: absolute; transform: translate(-50%, -50%); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform 0.2s; }
.pdr-node:hover { transform: translate(-50%, -50%) scale(1.12); z-index: 50; }
.pdr-node-icon-box { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: #161826; border: 2px solid #64748b; color: #fff; }
.pdr-node.selected .pdr-node-icon-box { box-shadow: 0 0 0 3px #ffffff, 0 0 20px rgba(230, 184, 92, 0.9) !important; border-color: #fff !important; }
.pdr-node.fog .pdr-node-icon-box { border: 2px dashed #94a3b8; background: rgba(18, 18, 28, 0.85); color: #94a3b8; }
.pdr-node-label { font-size: 11px; font-weight: 700; color: #ded8e8; background: rgba(14, 16, 26, 0.9); padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.12); white-space: nowrap; }

.pdr-subnode {
  position: absolute; transform: translate(-50%, -50%); cursor: pointer; display: flex; align-items: center; gap: 4px;

  // 🌟 熟练度换算阶位系统（每100一阶，沉浸式叙事阶位）
  function getProfRank(profVal) {
    const v = parseInt(profVal) || 0;
    if (v >= 700) return { title: "神阶", cls: "rk-god", desc: "触及因果与神之领域" };
    if (v >= 600) return { title: "帝阶", cls: "rk-emperor", desc: "君临一域之帝术" };
    if (v >= 500) return { title: "王阶", cls: "rk-king", desc: "冠绝群伦之王道" };
    if (v >= 400) return { title: "Ⅳ阶", cls: "rk-tier", desc: "精微臻境" };
    if (v >= 300) return { title: "Ⅲ阶", cls: "rk-tier", desc: "得心应手" };
    if (v >= 200) return { title: "Ⅱ阶", cls: "rk-tier", desc: "娴熟精湛" };
    if (v >= 100) return { title: "Ⅰ阶", cls: "rk-tier", desc: "初窥门径" };
    return { title: "见习", cls: "rk-novice", desc: "未入品阶" };

  function getCombatDesc(lv) {
    const num = Math.max(0, Math.min(8, parseFloat(lv) || 0));
    for (const item of combatLevels) {

  function getTheme(name) {
    const n = String(name || '').trim();
    if (themeColorMap[n]) return themeColorMap[n];
    const sorted = Object.keys(themeColorMap).sort((a,b) => b.length - a.length);
    for (const k of sorted) { if (n.includes(k)) return themeColorMap[k]; }

  /* ⭐ 玩家本人头像：从酒馆界面 DOM 读当前 persona 头像。
     原先 getAvatar 只查内置 avatarMap，玩家自己永远查不到 → 核心页头像一直显示占位框。
     选择器与「玩家头像·悬浮球」脚本保持一致，并补上对白里玩家消息的头像兜底。 */
  const KRS_PERSONA_SELECTORS = [
    '#user_avatar',
    '#user_avatar_block .avatar.selected img',
    '#user_avatar_block img.selected',
    '.persona_management .avatar.selected img',
    '.mes[is_user="true"] .avatar img',
    '.mes[is_user="true"] .mesAvatarWrapper img'
  ];
  const KRS_BAD_AVATAR = /user-default|default-user|default_avatar|\/img\/default|no-avatar|anonymous|placeholder|favicon/i;
  function krsUserAvatar() {
    /* 不做缓存：玩家可能有多个同名 persona，切换后必须立刻读到新的那张图 */
    const scopes = [document];
    try { if (window.parent && window.parent !== window) scopes.push(window.parent.document); } catch (_) {}
    try { if (window.top && window.top !== window) scopes.push(window.top.document); } catch (_) {}
    for (const sel of KRS_PERSONA_SELECTORS) {
      for (const sc of scopes) {
        try {
          const img = sc && sc.querySelector ? sc.querySelector(sel) : null;
          if (!img) continue;
          const v = String(img.getAttribute('src') || img.src || '').trim();
          if (v && !KRS_BAD_AVATAR.test(v)) return v;
        } catch (_) {}
      }
    }
    return '';
  }

  /* ⭐ 只给「核心页 · 主角立绘」用：优先酒馆 persona 头像。
     刻意不放进 getAvatar：若玩家把酒馆名取成「克蕾雅」这类角色名，
     关系列表里 getAvatar('克蕾雅', '克蕾雅') 会撞名，把克蕾雅自己的立绘顶掉。
     所以 persona 头像只走这个入口，角色立绘永远走内置表。 */
  function krsHeroAvatar(uName) {
    const ua = krsUserAvatar();
    if (ua) return ua;
    return getAvatar(uName, uName);
  }
  /* 暴露给下面的 persona 切换监听器：它在另一个作用域里，
     直接调用会 ReferenceError 并被 catch 静默吞掉（表现就是切换 persona 头像不更新）。 */
  try { window.__krsUserAvatar = krsUserAvatar; } catch (_) {}

  function getAvatar(name, curUserName) {
    const n = String(name || '').trim();
    if (!n) return FALLBACK_IMG;
    if (avatarMap[n]) return avatarMap[n].startsWith('http') ? avatarMap[n] : (IMAGE_BASE + avatarMap[n]);
    const sorted = Object.keys(avatarMap).sort((a,b) => b.length - a.length);
    for (const k of sorted) {
      if (n.includes(k)) {
        const val = avatarMap[k];
        return val.startsWith('http') ? val : (IMAGE_BASE + val);
      }
    }
    return FALLBACK_IMG;
  }

  function rs() {
    const scopes = [window];
    try { if (window.parent && window.parent !== window) scopes.push(window.parent); } catch(e){}
    try { if (window.top && window.top !== window) scopes.push(window.top); } catch(e){}
    for (const s of scopes) {
      try {
        if (s.Mvu && typeof s.Mvu.getMvuData === 'function') {
          const l = s.Mvu.getMvuData({ type: 'message', message_id: 'latest' });
          if (l && l.stat_data) return l.stat_data;
          if (l && (l['世界'] || l['user'])) return l;
        }
      } catch(e){}
      try {
        if (typeof s.getAllVariables === 'function') {
          const d = s.getAllVariables();
          if (d && d.stat_data) return d.stat_data;
          if (d && (d['世界'] || d['user'])) return d;
        }
      } catch(e){}
    }
    return null;
  }

  function safeGet(obj, path, def) {
    if (!obj) return def;
    const parts = path.split('.');
    let curr = obj;
    for (const p of parts) {
      if (curr === null || curr === undefined || typeof curr !== 'object') return def;
      curr = curr[p];
    }
    return curr !== undefined ? curr : def;
  }

  function safeSet(obj, path, val) {
    if (!obj) return;
    const parts = path.split('.');
    let curr = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      const p = parts[i];
      if (!curr[p] || typeof curr[p] !== 'object') curr[p] = {};
      curr = curr[p];
    }
    curr[parts[parts.length - 1]] = val;
  }

  async function mutateMvuStat(changeCallback) {
    let mvu = null;
    const scopes = [window, window.parent, window.top];
    for (const s of scopes) {
      try { if (s && s.Mvu && typeof s.Mvu.getMvuData === 'function') { mvu = s.Mvu; break; } } catch(_) {}
    }
    if (mvu) {
      try {
        const opts = { type: 'message', message_id: 'latest' };
        const cur = mvu.getMvuData(opts);
        if (cur) {
          const next = JSON.parse(JSON.stringify(cur));
          changeCallback(next.stat_data || next);
          await mvu.replaceMvuData(next, opts);
        }
      } catch(e) { console.warn('Mvu replace failed', e); }
    }
    const sd = rs();
    if (sd) changeCallback(sd);
  }

  function openEditor(path, label, type) {
    const sd = rs();
    if (!sd) return;
    const curVal = safeGet(sd, path, '');
    let modal = document.getElementById('krs-fast-editor');
    if (modal) modal.remove();

    modal = document.createElement('div');
    modal.id = 'krs-fast-editor';
    modal.className = 'krs-vedit-backdrop';

    let inputHtml = (type === 'textarea') 
      ? `<textarea class="krs-vedit-textarea" id="kf-val">${curVal}</textarea>`
      : `<input type="${type === 'number' ? 'number' : 'text'}" class="krs-vedit-input" id="kf-val" value="${curVal}">`;

    modal.innerHTML = `
      <div class="krs-vedit-pane">
        <div class="krs-vedit-head">
          <b>✏️ 变量微调 · ${label}</b>
          <button type="button" class="krs-vedit-x" id="kf-close">×</button>
        </div>
        <div>${inputHtml}</div>
        <div class="krs-vedit-actions">
          <button type="button" class="krs-vbtn clear" id="kf-clear">清空</button>
          <button type="button" class="krs-vbtn cancel" id="kf-cancel">取消</button>
          <button type="button" class="krs-vbtn save" id="kf-save">保存</button>
        </div>
      </div>
    `;

    document.body.appendChild(modal);
    const close = () => modal.remove();
    modal.querySelector('#kf-close').onclick = close;
    modal.querySelector('#kf-cancel').onclick = close;
    modal.querySelector('#kf-clear').onclick = () => { modal.querySelector('#kf-val').value = ''; };
    modal.querySelector('#kf-save').onclick = async () => {
      let v = modal.querySelector('#kf-val').value.trim();
      if (type === 'number') v = parseFloat(v) || 0;
      await mutateMvuStat(root => safeSet(root, path, v));
      close();
      renderAll();
    };
  }

    const lustVal = Math.min(200, Math.max(0, parseInt(safeGet(sd, 'user.淫乱度', 0)) || 0));

    root.querySelector('.hero-status-text').textContent = safeGet(sd, 'user.状态', '身体平稳');
    root.querySelector('.hero-dress-text').textContent = safeGet(sd, 'user.服装', '常服');

    const uContract = safeGet(sd, 'user.契约', '');
    const uBody = safeGet(sd, 'user.身体', '');
    let wHtml = '';
    if (uContract) wHtml += `<div class="krs-warn-tag"><b>[契约束缚]</b> <span data-krs-edit="user.契约" data-krs-label="契约">${uContract}</span></div>`;
    if (uBody) wHtml += `<div class="krs-warn-tag"><b>[肉体烙印]</b> <span data-krs-edit="user.身体" data-krs-label="身体烙印">${uBody}</span></div>`;
    root.querySelector('.hero-warn-slot').innerHTML = wHtml;

    // 主角专属特性与技能
    const userSkills = safeGet(sd, 'user.技能', {});
    const userTraits = safeGet(sd, 'user.特性', {});
    root.querySelector('.hero-traits-container').innerHTML = renderTraits(userTraits, 'user.特性');
    root.querySelector('.hero-skills-grouped-container').innerHTML = renderGroupedSkills(userSkills, 'user.技能');

    // 2. 关系栏
    const slider = root.querySelector('#relations-char-slider');
    const stage = root.querySelector('#relations-char-stage');

    if (charKeys.length === 0) {
      slider.innerHTML = '<div style="color:var(--font-muted);font-size:12px;padding:8px;">暂无记录角色。</div>';
      stage.innerHTML = '<div style="text-align:center;padding:40px;color:var(--font-muted);">周围暂无同行者</div>';
    } else {
      if (!activeCharName || !chars[activeCharName]) activeCharName = charKeys[0];

      slider.innerHTML = charKeys.map(cName => {
        const c = chars[cName] || {};
        const th = getTheme(cName);
        const isActive = (cName === activeCharName);
        const intim = Math.min(200, Math.max(0, parseInt(c['亲密程度']) || 0));
        const lust = Math.min(200, Math.max(0, parseInt(c['性吸引力']) || 0));
        const intimPct = ((intim / 200) * 100).toFixed(0);
        const lustPct = ((lust / 200) * 100).toFixed(0);

        return `
          <div class="krs-slider-card ${isActive ? 'active' : ''}" data-select-char="${cName}" style="--c-main:${th.main}; --c-rgb:${th.rgb}; --c-sub:${th.sub};">

            </div>
            <div class="krs-sc-vbars" title="亲密: ${intim}/200 | 欲望: ${lust}/200">
              <div class="krs-sc-vtrack" title="亲密度 ${intim}"><div class="krs-sc-vfill favor" style="height:${intimPct}%;--pct:${intimPct}%;"></div></div>
              <div class="krs-sc-vtrack" title="性吸引力 ${lust}"><div class="krs-sc-vfill lust" style="height:${lustPct}%;--pct:${lustPct}%;"></div></div>
            </div>
          </div>
        `;
      }).join('');

      const curC = chars[activeCharName] || {};
      const curTheme = getTheme(activeCharName);
      const intimacy = Math.min(200, Math.max(0, parseInt(curC['亲密程度']) || 0));
      const attract = Math.min(200, Math.max(0, parseInt(curC['性吸引力']) || 0));
      const cCombat = safeGet(curC, '战力水平', 1);

      const charSkills = curC['技能'] || {};
      const charTraits = curC['特性'] || {};

      // 🌟 强力同步专属主色调（边框、立绘框、名言、按钮、进度条全套继承）
      stage.innerHTML = `
        <div class="krs-heroine-card" style="--c-main:${curTheme.main} !important; --c-rgb:${curTheme.rgb} !important; --c-sub:${curTheme.sub} !important; border: 1.5px solid ${curTheme.main} !important; box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 16px rgba(${curTheme.rgb}, 0.22) !important;">
          <div class="krs-heroine-top-box">
            <div class="krs-heroine-avatar-box" style="border-color:${curTheme.main} !important; box-shadow: 0 0 14px rgba(${curTheme.rgb}, 0.45) !important;">
              <img src="${getAvatar(activeCharName, uName)}" alt="${activeCharName}">
              ${curC['futa模式'] ? '<span class="krs-h-futa-badge">⚧ 双性</span>' : ''}
            </div>

            <div class="krs-heroine-info-box">
              <div class="krs-heroine-header">
                <div class="krs-heroine-title-left">
                  <span class="krs-heroine-name">${activeCharName}</span>
                  <span class="krs-heroine-identity" data-krs-edit="角色.${activeCharName}.身份" data-krs-label="身份" style="color:${curTheme.sub} !important;">${curC['身份']||'未知'}</span>
                  <!-- 🌟 补回角色专属画册按钮 -->
                  <button type="button" class="krs-pill cg-hero-btn" data-cg-char="${activeCharName}" title="查看【${activeCharName}】专属画册与密藏CG" style="background:rgba(${curTheme.rgb}, 0.2) !important; border-color:${curTheme.main} !important; color:${curTheme.sub} !important; cursor:pointer;">
                    <span>📷 专属画册</span>
                  </button>
                </div>
                <div class="krs-heroine-badges">
                  <span class="krs-pill" style="border-color:${curTheme.main} !important; background:rgba(${curTheme.rgb}, 0.15) !important; color:${curTheme.sub} !important;">⚔️ ${getCombatDesc(cCombat)}</span>
                  <span class="krs-pill" style="border-color:${curTheme.main} !important; background:rgba(${curTheme.rgb}, 0.15) !important; color:${curTheme.sub} !important;">关系: ${curC['关系']||'结缘'}</span>
                  <button type="button" class="krs-pill" data-del-char="${activeCharName}" style="color:#ff858d; border-color:rgba(224,49,49,0.4);">清退</button>
                  <span class="krs-pill" title="持有金币" style="border-color:${curTheme.main} !important; background:rgba(${curTheme.rgb}, 0.15) !important; color:${curTheme.sub} !important;">💰 ${curC['金币']||0} G</span>
                </div>
              </div>

              <div class="krs-quote-box" data-krs-edit="角色.${activeCharName}.动向" data-krs-label="动向" style="border-left-color:${curTheme.main} !important;">
                “${curC['动向'] || '无特别动向，陪伴于身旁。'}”
              </div>

              <div class="krs-heroine-bars">
                <div class="krs-hbar-line" data-krs-edit="角色.${activeCharName}.亲密程度" data-krs-label="亲密度" data-krs-type="number">
                  <span class="krs-hbar-lbl"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${curTheme.main};box-shadow:0 0 6px ${curTheme.main};margin-right:4px;"></span>羁绊 / 亲密度</span>
                  <div class="krs-hbar-track">
                    <div class="krs-hbar-fill" style="width:${(intimacy/200)*100}%; background:linear-gradient(90deg, rgba(${curTheme.rgb}, 0.5), ${curTheme.main}) !important; box-shadow:0 0 8px rgba(${curTheme.rgb}, 0.6) !important;"></div>
                  </div>
                  <span class="krs-hbar-val" style="color:${curTheme.sub} !important;">${intimacy}</span>
                </div>
                <div class="krs-hbar-line" data-krs-edit="角色.${activeCharName}.性吸引力" data-krs-label="性吸引力" data-krs-type="number">
                  <span class="krs-hbar-lbl"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff7e9e;box-shadow:0 0 6px #ff7e9e;margin-right:4px;"></span>欲望 / 吸引力</span>
                  <div class="krs-hbar-track">
                    <div class="krs-hbar-fill" style="width:${(attract/200)*100}%; background:linear-gradient(90deg, #db2777, #ff7e9e) !important; box-shadow:0 0 8px rgba(255, 126, 158, 0.6) !important;"></div>
                  </div>
                  <span class="krs-hbar-val" style="color:#ff7e9e !important;">${attract}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="krs-heroine-meta-grid">
            <div class="krs-hm-item"><span class="krs-hm-lbl">地点</span><span class="krs-hm-val" data-krs-edit="角色.${activeCharName}.地点" data-krs-label="地点">${curC['地点']||'同驻留'}</span></div>
            <div class="krs-hm-item"><span class="krs-hm-lbl">服装</span><span class="krs-hm-val" data-krs-edit="角色.${activeCharName}.服装" data-krs-label="服装">${curC['服装']||'常规'}</span></div>
            <div class="krs-hm-item"><span class="krs-hm-lbl">状态</span><span class="krs-hm-val" data-krs-edit="角色.${activeCharName}.身体状态" data-krs-label="身体状态">${curC['身体状态']||'良好'}</span></div>
            <div class="krs-hm-item"><span class="krs-hm-lbl">身体</span><span class="krs-hm-val" data-krs-edit="角色.${activeCharName}.身体" data-krs-label="身体印记" style="color:#ffc2c5;">${curC['身体']||'无异变'}</span></div>
          </div>

          <div class="krs-heroine-ability-box">
            <div class="krs-sub-sec-head">
              <span class="sec-title">⚔️ 角色本领与特性 (${activeCharName}专属)</span>
            </div>
            
            <div class="krs-traits-wrapper">
              <div class="krs-traits-sub-title">✦ 固有特性 / 血脉印记</div>
              ${renderTraits(charTraits, `角色.${activeCharName}.特性`)}
            </div>

            <div class="krs-grouped-skills-scroll-area">
              ${renderGroupedSkills(charSkills, `角色.${activeCharName}.技能`)}
            </div>
          </div>
        </div>
      `;
    }

    // 3. 命途纪事
    const destinyStage = root.querySelector('#destiny-stage');
    let taskKeys = evKeys.filter(k => events[k]['类型'] !== '命运' && events[k]['类型'] !== '危机');
    let fateKeys = evKeys.filter(k => events[k]['类型'] === '命运' || events[k]['类型'] === '危机');

    destinyStage.innerHTML = `
      <div>
        <div class="krs-eb-group-title" style="color:#7dd3fc;">📜 事务日程与常务委托 (${taskKeys.length})</div>
        <div class="krs-eb-group-list">
          ${taskKeys.map(k => renderEventItem(k, events[k])).join('') || '<div style="color:var(--font-muted);font-size:11px;padding:6px;">暂无事务</div>'}
        </div>
      </div>

      <div style="margin-top:10px;">
        <div class="krs-eb-group-title" style="color:#d7bde2;">🔮 宿命因果与危局警报 (${fateKeys.length})</div>
        <div class="krs-eb-group-list">
          ${fateKeys.map(k => renderEventItem(k, events[k])).join('') || '<div style="color:var(--font-muted);font-size:11px;padding:6px;">暂无命运事件</div>'}
        </div>
      </div>
    `;

    // 3.5 世界风云
    const CR_PH = ['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ', 'Ⅵ', 'Ⅶ', 'Ⅷ', 'Ⅸ', 'Ⅹ'];
    const CR_PN = { 'Ⅰ': '前兆', 'Ⅱ': '蔓延', 'Ⅲ': '边境沦陷', 'Ⅳ': '割据', 'Ⅴ': '沦城',
                    'Ⅵ': '崩解', 'Ⅶ': '围城', 'Ⅷ': '灭国', 'Ⅸ': '长夜', 'Ⅹ': '终局' };
    const crEsc = function (x) {
      return String(x == null ? '' : x).replace(/[<>]/g, function (ch) { return ch === '<' ? '&lt;' : '&gt;'; });
    };
    const crisis = safeGet(sd, '世界风云', {}) || {};
    const crOn = !!crisis['启用'];
    const crBadge = root.querySelector('.crisis-count-badge');
    if (crBadge) crBadge.textContent = crOn ? (crisis['阶段'] || 'Ⅰ') : '—';
    const crisisStage = root.querySelector('#crisis-stage');
    if (crisisStage) {
      if (!crOn) {
        crisisStage.innerHTML = '<div class="krs-crisis-off">本局未启用「世界风云」'
          + '<span>世界级危机不在剧本内，不会发生。</span></div>';
      } else {
        const cPh = Math.max(0, CR_PH.indexOf(crisis['阶段'] || 'Ⅰ'));
        const cLast = cPh === 9;
        const cSegs = CR_PH.map(function (p, i) {
          return '<span class="krs-cr-seg' + (i <= cPh ? ' on' : '') + (i === 9 ? ' end' : '') + '"></span>';
        }).join('');
        const cCell = function (label, val, cls, wide) {
          if (!val) return '';
          return '<div class="krs-cr-cell' + (cls ? ' ' + cls : '') + (wide ? ' wide' : '') + '">'
            + '<div class="krs-cr-label">' + label + '</div>'
            + '<div class="krs-cr-val">' + crEsc(val) + '</div></div>';
        };
        crisisStage.innerHTML = '<div class="krs-cr">'
          + '<div class="krs-cr-head">'
          +   '<span class="krs-cr-kicker">世 界 风 云</span>'
          +   '<span class="krs-cr-name">' + crEsc(crisis['名称'] || '未命名风云') + '</span>'
          +   '<span class="krs-cr-phase">阶段 <b>' + crEsc(crisis['阶段'] || 'Ⅰ') + '</b> '
          +     crEsc(CR_PN[crisis['阶段'] || 'Ⅰ'] || '') + '</span>'
          +   (crisis['倒计时'] ? '<span class="krs-cr-count">' + crEsc(crisis['倒计时']) + '</span>' : '')
          + '</div>'
          + '<div class="krs-cr-bar">' + cSegs + '</div>'
          + (crisis['介绍'] ? '<div class="krs-cr-desc">' + crEsc(crisis['介绍']) + '</div>' : '')
          + '<div class="krs-cr-grid">'
          +   cCell('解决风云目标', crisis['解决目标'], 'aim', true)
          +   cCell('我方进展', crisis['我方进展'])
          +   cCell('风云阶段影响', crisis['阶段影响'])
          +   cCell('风云次阶段', crisis['次阶段'], '', true)
          +   cCell('风云对世界影响', crisis['世界影响'], 'news', true)
          + '</div>'
          + (cLast ? '<div class="krs-cr-final">Ⅹ · 终局已经到来。世界生灵涂炭，此刻的「胜利」不再意味着任何事。</div>' : '')
          + '</div>';
      }
    }

    // 🌟 4. 资产 / 领地渲染逻辑（分类过滤 + SVG 纯净矢量徽标）
    const aCatBar = root.querySelector('#assets-category-bar');
    const aSlider = root.querySelector('#assets-slider');
    const aStage = root.querySelector('#assets-stage');

    if (aCatBar && aSlider && aStage) {
      if (assetKeys.length === 0) {
        aCatBar.innerHTML = '';
        aSlider.innerHTML = '<div style="color:var(--font-muted);font-size:12px;padding:8px;">暂无名下产业。</div>';
        aStage.innerHTML = '<div style="text-align:center;padding:50px;color:var(--font-muted);font-size:12px;">尚未登记私产、店铺、工坊或代管领地。</div>';
      } else {
        // 统计各类别数量
        const counts = { '全部': assetKeys.length, '家': 0, '经营': 0, '制造': 0, '领地': 0 };
        assetKeys.forEach(k => {
          const c = normalizeAssetCategory(assets[k]['类型']);
          if (counts[c] !== undefined) counts[c]++;
        });

        // 渲染大类药丸过滤栏
        const catTabs = ['全部', '家', '经营', '制造', '领地'];
        aCatBar.innerHTML = catTabs.map(cat => `
          <button type="button" class="krs-asset-cat-pill ${activeAssetCat === cat ? 'active' : ''}" data-asset-cat="${cat}">
            ${cat !== '全部' ? getAssetSvgIcon(cat, 14) : ''}
            <span>${cat}</span>
            <span class="krs-cat-badge">${counts[cat] || 0}</span>
          </button>
        `).join('');

        // 筛选当前分类资产
        const filteredKeys = assetKeys.filter(k => {
          if (activeAssetCat === '全部') return true;
          return normalizeAssetCategory(assets[k]['类型']) === activeAssetCat;
        });

        if (filteredKeys.length > 0 && !filteredKeys.includes(activeAssetName)) {
          activeAssetName = filteredKeys[0];
        }

        // 渲染滑轨卡片
        if (filteredKeys.length === 0) {
          aSlider.innerHTML = `<div style="color:var(--font-muted);font-size:11.5px;padding:8px;">当前【${activeAssetCat}】分类下无资产。</div>`;
          aStage.innerHTML = `<div style="text-align:center;padding:50px;color:var(--font-muted);font-size:12px;">该类目下暂无登记资产。</div>`;
        } else {
          aSlider.innerHTML = filteredKeys.map(aName => {
            const a = assets[aName] || {};
            const isActive = (aName === activeAssetName);
            const iconSvg = getAssetSvgIcon(a['类型'], 18);
            return `
              <div class="krs-asset-slider-card ${isActive ? 'active' : ''}" data-select-asset="${aName}">
                <div class="krs-asc-icon-box">${iconSvg}</div>
                <div class="krs-asc-info">
                  <span class="krs-asc-name">${aName}</span>
                  <span class="krs-asc-sub">
                    <span>${a['类型'] || '家'}</span>
                    <span>阶位${a['规模'] || 1}</span>
                  </span>
                </div>
              </div>
            `;
          }).join('');

          // 渲染选中资产的大看板
          const curA = assets[activeAssetName] || {};
          const isHome = normalizeAssetCategory(curA['类型']) === '家';
          const basePath = `user.资产.${activeAssetName}`;

          let workerBadgeHtml = '';
          const allocStr = String(curA['分配'] || '');
          const wMatch = allocStr.match(/(\d+)\s*人/);
          if (!isHome && wMatch) {
            workerBadgeHtml = `<div class="krs-asset-worker-badge">👥 雇工 ${wMatch[1]} 人</div>`;
          }

          const memStr = isHome ? (curA['住客'] || '') : (curA['分配'] || '');
          const memHtml = renderAssetMembers(memStr, uName);

          const buildObj = curA['建设序列'] || {};
          const bKeys = Object.keys(buildObj);
          let buildHtml = '';
          if (bKeys.length > 0) {
            buildHtml = `
              <div class="krs-asset-build-sec">
                <div class="krs-sub-sec-head">
                  <span class="sec-title">🏛️ 改进建设 (${bKeys.length})</span>
                  <span class="sec-sub">五档阶段演进</span>
                </div>
                <div class="krs-build-blocks-grid">
                  ${bKeys.map(k => {
                    const meta = getBuildStageMeta(buildObj[k]);
                    return `
                      <div class="krs-build-block-card" data-krs-edit="${basePath}.建设序列.${k}" data-krs-label="${activeAssetName} - ${k} 阶段">
                        <div class="krs-bbc-top">
                          <span class="krs-bbc-title">${k}</span>
                          <span class="krs-bbc-tag ${meta.cls}">${meta.label}</span>
                        </div>
                        <div class="krs-bbc-bar-track">
                          <div class="krs-bbc-bar-fill ${meta.cls}" style="width:${meta.pct}%;"></div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          } else {
            buildHtml = `
              <div class="krs-asset-build-sec">
                <div style="color:var(--font-muted); font-size:11.5px; padding:12px; text-align:center;">暂无建设序列登记。</div>
              </div>
            `;
          }

          aStage.innerHTML = `
            <div class="krs-asset-hero-card">
              <div class="krs-ahc-top">
                <div class="krs-ahc-title-box">
                  <div class="krs-ahc-icon">${getAssetSvgIcon(curA['类型'], 24)}</div>
                  <div class="krs-ahc-name-col">
                    <div class="krs-ahc-name-row">
                      <span class="krs-ahc-name">${activeAssetName}</span>
                      <span class="krs-asset-scale-pill" data-krs-edit="${basePath}.规模" data-krs-label="资产规模 (1-8)" data-krs-type="number">阶位 ${curA['规模'] || 1}</span>
                    </div>
                    <div class="krs-ahc-badges">

  function renderEventItem(name, item) {
    const type = item['类型'] || '任务';
    const isOpen = openEventItemKeys.has(name);
    const basePath = `世界.事件.${name}`;
    const isFate = (type === '命运');

    let cls = 'task';
    if (type === '活动') cls = 'activity';
    else if (type === '危机') cls = 'crisis';
    else if (type === '命运') cls = 'fate';

    // 目标与主要内容
    const goalVal = item['阶段目标'] || item['内容'] || '';
    const goalProp = item['阶段目标'] ? '阶段目标' : '内容';

    // 背景背景叙事
    const bgDesc = item['背景描述'] || '';
    // 角色副标任务
    const subTask = item['角色与任务'] || '';
    // 阶段/时限
    const phaseVal = item['阶段'] || item['期限'] || (isFate ? '阶段1' : '当前');
    const phaseProp = item['阶段'] ? '阶段' : '期限';

    return `
      <div class="krs-eb-item-wrap ${isOpen ? 'open' : ''}" data-event-name="${name}">
        <div class="krs-eb-row">
          <div class="krs-eb-row-left" style="overflow:hidden; text-overflow:ellipsis;">
            <span class="krs-eb-type-pill ${cls}" data-krs-edit="${basePath}.类型" data-krs-label="类型">【${type}】</span>
            <span class="krs-eb-name-text">${name}</span>
            ${subTask ? `<span class="krs-eb-title-lead" data-krs-edit="${basePath}.角色与任务" data-krs-label="角色与任务">/ ${subTask}</span>` : (goalVal && !isFate ? `<span class="krs-eb-title-lead">/ ${goalVal}</span>` : '')}
          </div>
          <div class="krs-eb-row-right">
            ${isFate ? `<span class="krs-eb-phase-badge" data-krs-edit="${basePath}.${phaseProp}" data-krs-label="主线阶段">🔮 ${phaseVal}</span>` : ''}
            <span style="font-size:11px;color:var(--font-muted);" data-krs-edit="${basePath}.状态" data-krs-label="事件状态">${item['状态']||'进行中'}</span>
            <span class="krs-eb-chevron">▼</span>
          </div>
        </div>

        <div class="krs-eb-detail-drawer">
          ${bgDesc ? `
            <div class="krs-eb-bg-desc" data-krs-edit="${basePath}.背景描述" data-krs-label="背景描述" data-krs-type="textarea">
              <b>◆ 背景:</b>${bgDesc}
            </div>
          ` : ''}

          <div class="krs-eb-subgoal" data-krs-edit="${basePath}.${goalProp}" data-krs-label="${isFate ? '阶段目标' : '详细内容'}" data-krs-type="textarea">
            <b>${isFate ? '✦ 阶段目标:' : '✦ 任务内容:'}</b>${goalVal || '暂无详细描述'}
          </div>

          <div class="krs-eb-detail-footer">
            <span>${isFate ? '当前主线进程' : '期限/限制'}: <b data-krs-edit="${basePath}.${phaseProp}" data-krs-label="${phaseProp}">${phaseVal}</b></span>
            <button type="button" class="krs-pill" data-del-event="${name}">清退</button>
          </div>
        </div>
      </div>
    `;
  }

  // 🌟 资产人员头像与姓名首字徽章渲染核心
  function renderAssetMembers(str, uName) {
    if (!str || !str.trim()) return '';
    const items = str.split('、').map(s => s.trim()).filter(Boolean);
    let html = '';

    items.forEach(raw => {
      // 匹配形如：角色名(职位)
      const m = raw.match(/^([^(（]+)[(（]([^)）]+)[)）]$/);
      if (m) {
        const name = m[1].trim();
        const role = m[2].trim();
        // 过滤人员计数（避免给"其余人员"画头像）
        if (name.includes('人员') || name.includes('雇工') || role.endsWith('人')) return;

        const av = getAvatar(name, uName);
        const hasAv = (av && av !== FALLBACK_IMG);
        const initial = name ? name[0] : '人';

        html += `
          <div class="krs-asset-mem-item" title="${name} (${role})">
            ${hasAv 
              ? `<img class="krs-asset-mem-avatar" src="${av}" alt="${name}">`
              : `<div class="krs-asset-mem-initial">${initial}</div>`
            }
            <span class="krs-asset-mem-name">${name}</span>
            <span class="krs-asset-mem-role">${role}</span>
          </div>
        `;
      }
    });
    return html;
  }

  // 🌟 建设序列阶级转换与进度换算
  function getBuildStageMeta(stage) {
    const s = String(stage || '');
    if (s.includes('鼎沸')) return { cls: 'stg-5', pct: 100, label: '鼎沸 (巅峰)' };
    if (s.includes('卓绝')) return { cls: 'stg-4', pct: 80,  label: '卓绝 (前列)' };
    if (s.includes('精熟')) return { cls: 'stg-3', pct: 60,  label: '精熟 (标志)' };
    if (s.includes('成形')) return { cls: 'stg-2', pct: 40,  label: '成形' };
    return { cls: 'stg-1', pct: 20, label: '草创' };
  }

  // 🌟 精致矢量 SVG 微标（取代系统自带 Emoji）
  function getAssetSvgIcon(type, size = 18) {
    const t = String(type || '').trim();
    if (t.includes('家')) {
      return `<div class="krs-svg-icon type-home"><svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>`;
    }
    if (t.includes('经营') || t.includes('商')) {
      return `<div class="krs-svg-icon type-biz"><svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>`;
    }
    if (t.includes('制造') || t.includes('工坊') || t.includes('磨坊')) {
      return `<div class="krs-svg-icon type-craft"><svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>`;
    }
    if (t.includes('领地')) {
      return `<div class="krs-svg-icon type-domain"><svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M22 20v-7.8a2 2 0 0 0-.6-1.4l-7.4-7.4a2 2 0 0 0-2.8 0L3.8 10.8a2 2 0 0 0-.6 1.4V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2Z"/><path d="M18 11v-4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v2"/><path d="M12 22v-6a2 2 0 0 0-2-2H8"/></svg></div>`;
    }
    return `<div class="krs-svg-icon" style="color:#cbd5e1;"><svg width="${size}" height="${size}" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 10h1"/><path d="M9 14h1"/><path d="M9 18h1"/><path d="M14 10h1"/><path d="M14 14h1"/><path d="M14 18h1"/></svg></div>`;
  }

  // 🌟 规范化资产类型为标准 4 类
  function normalizeAssetCategory(type) {
    const t = String(type || '').trim();
    if (t.includes('家')) return '家';
    if (t.includes('经营') || t.includes('商')) return '经营';
    if (t.includes('制造') || t.includes('工坊') || t.includes('磨坊')) return '制造';
    if (t.includes('领地')) return '领地';
    return '家';
  }

  function getCharCgKey(name) {
    const n = String(name || '').trim();
    if (n.includes("露易丝") || n.includes("提亚拉") || n.includes("古伊奈") || n.includes("小春") || n.includes("五月雨") || n.includes("大王") || n.includes("王逝")) return "KingExit / 王逝篇";
    if (n.includes("雷克西斯") || n.includes("帕特里琪娅") || n.includes("奇诺米") || n.includes("蒂莎") || n.includes("加莉泰娅") || n.includes("医术师") || n.includes("温伯格")) return "医术师 / 温伯格篇";
    if (n.includes("艾尔希") || n.includes("狄娜") || n.includes("卡莲") || n.includes("柯萝特") || n.includes("幽妮娅") || n.includes("祈愿诗篇") || n.includes("安纳托尔")) return "祈愿诗篇 / 安纳托尔篇";
    for (const k in cgDatabase) { if (n.includes(k) || k.includes(n)) return k; }
    return null;
  }

  function openCgGalleryModal(targetCharName) {
    let resolvedChar = targetCharName ? (getCharCgKey(targetCharName) || targetCharName) : null;
    let modal = document.getElementById('krs-cg-modal-root');
    if (modal) modal.remove();

    modal = document.createElement('div');
    modal.id = 'krs-cg-modal-root';
    modal.className = 'krs-cg-modal-backdrop';

    let currentView = resolvedChar ? 'char' : 'albums';
    let currentChar = resolvedChar;
    let currentTab = 'normal';
    let currentCgIndex = 0;

    function renderModalContent() {
      const charKeys = Object.keys(cgDatabase);
      if (currentView === 'albums') {
        let cardsHtml = '';
        charKeys.forEach(name => {
          const charObj = cgDatabase[name] || { normal: [], nsfw: [] };
          const normalList = charObj.normal || [];
          const nsfwList = charObj.nsfw || [];
          const totalCount = normalList.length + nsfwList.length;
          const cover = charObj.cover || (normalList[0] ? normalList[0].url : FALLBACK_IMG);
          cardsHtml += `
            <div class="krs-cg-album-card" data-cg-char="${name}">
              <img class="krs-cg-album-cover" src="${cover}" alt="${name}">
              <div class="krs-cg-album-info">
                <span>${name}</span>
                <span style="color:var(--theme-sub);font-weight:700;">${totalCount} 张</span>
              </div>
            </div>
          `;
        });
        modal.innerHTML = `
          <div class="krs-cg-window">
            <div class="krs-cg-topbar">
              <div class="krs-cg-top-title"><span>📖 命运相册 / 全角色绘卷</span></div>
              <button type="button" class="krs-cg-close-btn" id="cg-close-btn">×</button>
            </div>
            <div class="krs-cg-body"><div class="krs-cg-albums-grid">${cardsHtml}</div></div>
          </div>
        `;
      } else if (currentView === 'char') {
        const charObj = cgDatabase[currentChar] || { normal: [], nsfw: [] };
        const normalList = charObj.normal || [];
        const nsfwList = charObj.nsfw || [];
        const currentList = (currentTab === 'nsfw') ? nsfwList : normalList;

        let itemsHtml = '';
        if (currentList.length === 0) {
          itemsHtml = `<div style="grid-column: 1 / -1; text-align: center; color: var(--font-muted); padding: 40px;">当前分类暂未收录插图。</div>`;
        } else {
          currentList.forEach((cg, idx) => {
            itemsHtml += `
              <div class="krs-cg-item-card" data-cg-idx="${idx}">
                <img class="krs-cg-item-img" src="${cg.url}" alt="${cg.title}">
                <div class="krs-cg-item-title">${cg.title}</div>
              </div>
            `;
          });
        }
        modal.innerHTML = `
          <div class="krs-cg-window">
            <div class="krs-cg-topbar">
              <div class="krs-cg-top-title">
                <button type="button" class="krs-cg-back-btn" id="cg-back-btn">‹ 返回全部相册</button>
                <span>${currentChar} · 专属画册</span>
              </div>
              <button type="button" class="krs-cg-close-btn" id="cg-close-btn">×</button>
            </div>
            <div class="krs-cg-tab-bar">
              <button type="button" class="krs-cg-tab ${currentTab === 'normal' ? 'active' : ''}" id="tab-normal">📷 常规画集 (${normalList.length})</button>
              <button type="button" class="krs-cg-tab nsfw-tab ${currentTab === 'nsfw' ? 'active' : ''}" id="tab-nsfw">🔞 密藏画集 / NSFW (${nsfwList.length})</button>
            </div>
            <div class="krs-cg-body"><div class="krs-cg-items-grid">${itemsHtml}</div></div>
          </div>
        `;
      } else if (currentView === 'lightbox') {
        const charObj = cgDatabase[currentChar] || { normal: [], nsfw: [] };
        const list = (currentTab === 'nsfw') ? (charObj.nsfw || []) : (charObj.normal || []);
        const currentCg = list[currentCgIndex] || list[0];
        modal.innerHTML = `
          <div class="krs-cg-window" style="height: 85vh;">
            <div class="krs-cg-topbar">
              <div class="krs-cg-top-title">
                <button type="button" class="krs-cg-back-grid" id="cg-back-grid">‹ 返回列表</button>
                <span>${currentChar} · ${currentCg.title}</span>
              </div>
              <button type="button" class="krs-cg-close-btn" id="cg-close-btn">×</button>
            </div>
            <div class="krs-cg-body" style="height: 100%;">
              <div class="krs-cg-viewer">
                <div class="krs-cg-viewer-imgbox">
                  <img class="krs-cg-viewer-img" src="${currentCg.url}">
                </div>
                <div class="krs-cg-viewer-nav">
                  <button type="button" class="krs-cg-nav-btn" id="cg-prev">‹ 上一张</button>
                  <span style="font-size:12px;color:#fff;">${currentCgIndex + 1} / ${list.length}</span>
                  <button type="button" class="krs-cg-nav-btn" id="cg-next">下一张 ›</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }
      bindModalEvents();
    }

    function bindModalEvents() {
      const closeBtn = modal.querySelector('#cg-close-btn');
      if (closeBtn) closeBtn.onclick = () => modal.remove();
      modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

      modal.querySelectorAll('.krs-cg-album-card').forEach(card => {
        card.onclick = () => {
          currentChar = card.getAttribute('data-cg-char');
          currentTab = 'normal';
          currentView = 'char';
          renderModalContent();
        };
      });

      const backBtn = modal.querySelector('#cg-back-btn');
      if (backBtn) backBtn.onclick = () => { currentView = 'albums'; renderModalContent(); };

      const tabNorm = modal.querySelector('#tab-normal');
      const tabNsfw = modal.querySelector('#tab-nsfw');
      if (tabNorm) tabNorm.onclick = () => { currentTab = 'normal'; renderModalContent(); };
      if (tabNsfw) tabNsfw.onclick = () => { currentTab = 'nsfw'; renderModalContent(); };

      modal.querySelectorAll('.krs-cg-item-card').forEach(card => {
        card.onclick = () => {
          currentCgIndex = parseInt(card.getAttribute('data-cg-idx')) || 0;
          currentView = 'lightbox';
          renderModalContent();
        };
      });

      const backGrid = modal.querySelector('#cg-back-grid');
      if (backGrid) backGrid.onclick = () => { currentView = 'char'; renderModalContent(); };

      const prevBtn = modal.querySelector('#cg-prev');
      const nextBtn = modal.querySelector('#cg-next');
      const charObj = cgDatabase[currentChar] || { normal: [], nsfw: [] };
      const list = (currentTab === 'nsfw') ? (charObj.nsfw || []) : (charObj.normal || []);
      if (prevBtn) prevBtn.onclick = () => { currentCgIndex = (currentCgIndex - 1 + list.length) % list.length; renderModalContent(); };
      if (nextBtn) nextBtn.onclick = () => { currentCgIndex = (currentCgIndex + 1) % list.length; renderModalContent(); };
    }

    document.body.appendChild(modal);
    renderModalContent();
  }

  function bindEvents() {
    const root = document.querySelector('.krs-status-root');
    if (!root || root.dataset.bound) return;
    root.dataset.bound = 'true';

    root.addEventListener('click', async (e) => {
      // 🌟 1. 顶部总相册入口点击触发
      const hubBtn = e.target.closest('.cg-hub-btn');
      if (hubBtn) {
        openCgGalleryModal(null);
        return;
      }

      // 🌟 2. 角色卡内【专属画册】按钮点击触发
      const heroCgBtn = e.target.closest('.cg-hero-btn');
      if (heroCgBtn) {
        const cName = heroCgBtn.getAttribute('data-cg-char') || activeCharName;
        openCgGalleryModal(cName);
        return;
      }

      // 🌟 头像栏滚轮横向滑动
      const sliderWrap = document.querySelector('.krs-char-slider-wrap');
      if (sliderWrap && !sliderWrap.dataset.wheelBound) {
        sliderWrap.dataset.wheelBound = 'true';
        sliderWrap.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) {
            e.preventDefault();
            sliderWrap.scrollLeft += e.deltaY;
          }
        }, { passive: false });
      }

      // 1. Tab 切换
      const tabBtn = e.target.closest('.krs-nav-tab');
      if (tabBtn) {
        activeTab = tabBtn.getAttribute('data-tab');
        root.querySelectorAll('.krs-nav-tab').forEach(b => b.classList.toggle('active', b === tabBtn));
        root.querySelectorAll('.krs-tab-pane').forEach(p => p.classList.toggle('active', p.id === `pane-${activeTab}`));
        if (activeTab === 'map' && window.initEmbeddedMap) window.initEmbeddedMap();
        return;
      }

      // 2. 关系角色点击
      const scCard = e.target.closest('[data-select-char]');
      if (scCard) {
        activeCharName = scCard.getAttribute('data-select-char');
        renderAll();
        return;
      }

      // 🌟 2.1 资产大类过滤切换
      const catBtn = e.target.closest('[data-asset-cat]');
      if (catBtn) {
        activeAssetCat = catBtn.getAttribute('data-asset-cat');
        renderAll();
        return;
      }

      // 🌟 2.2 资产滑轨点击切换
      const saCard = e.target.closest('[data-select-asset]');
      if (saCard) {
        activeAssetName = saCard.getAttribute('data-select-asset');
        renderAll();
        return;
      }

      // 🌟 编辑模式开关
      const editBtn = e.target.closest('.edit-toggle-btn');
      if (editBtn) {
        isEditMode = !isEditMode;
        root.classList.toggle('krs-editing', isEditMode);
        return;
      }

      // 🌟 【最高优先级判定】：若处于编辑模式且点中了任何带虚线框的字段，直接弹出微调，禁止触发展开/折叠
      if (isEditMode) {
        /* 【世界风云】页的变量只由「命运之书 · 世界风云」页写入，不走这里的手动微调 */
        if (e.target.closest && e.target.closest('#pane-crisis')) return;
        const editField = e.target.closest('[data-krs-edit]');
        if (editField) {
          e.preventDefault();
          e.stopImmediatePropagation();
          const path = editField.getAttribute('data-krs-edit');
          const label = editField.getAttribute('data-krs-label') || '变量';
          const type = editField.getAttribute('data-krs-type') || 'text';
          openEditor(path, label, type);
          return;
        }
      }

      // 3. 方块技能展开/折叠
      const skillCard = e.target.closest('[data-skill-block]');
      if (skillCard) {
        const k = skillCard.getAttribute('data-skill-block');
        if (openSkillBlockKeys.has(k)) openSkillBlockKeys.delete(k);
        else openSkillBlockKeys.add(k);
        skillCard.classList.toggle('open');
        return;
      }

      // 4. 特性展开/折叠
      const traitCard = e.target.closest('[data-trait-card]');
      if (traitCard) {
        const k = traitCard.getAttribute('data-trait-card');
        if (openTraitKeys.has(k)) openTraitKeys.delete(k);
        else openTraitKeys.add(k);
        traitCard.classList.toggle('open');
        return;
      }

      // 5. 事件折叠
      const ebRow = e.target.closest('.krs-eb-row');
      if (ebRow) {
        const wrap = ebRow.closest('.krs-eb-item-wrap');
        const k = wrap.getAttribute('data-event-name');
        if (openEventItemKeys.has(k)) openEventItemKeys.delete(k);
        else openEventItemKeys.add(k);
        wrap.classList.toggle('open');
        return;
      }

      // 8. 清退角色
      const delChar = e.target.closest('[data-del-char]');
      if (delChar) {
        const target = delChar.getAttribute('data-del-char');
        if (confirm(`确定彻底清退角色【${target}】吗？`)) {
          await mutateMvuStat(r => { if (r['角色']) delete r['角色'][target]; });
          activeCharName = '';
          renderAll();
        }
        return;
      }

      // 9. 清退事件
      const delEv = e.target.closest('[data-del-event]');
      if (delEv) {
        const target = delEv.getAttribute('data-del-event');
        if (confirm(`确定清退该事项【${target}】吗？`)) {
          await mutateMvuStat(r => { if (r['世界'] && r['世界']['事件']) delete r['世界']['事件'][target]; });
          renderAll();
        }
        return;
      }

      // 10. 清退资产
      const delAsset = e.target.closest('[data-del-asset]');
      if (delAsset) {
        const target = delAsset.getAttribute('data-del-asset');
        if (confirm(`确定变卖/废弃资产【${target}】吗？`)) {
          await mutateMvuStat(r => { if (r['user'] && r['user']['资产']) delete r['user']['资产'][target]; });
          renderAll();
        }
        return;
      }

      // 11. 折叠面板
      const colBtn = e.target.closest('#krs-btn-collapse');
      if (colBtn) {
        const isCol = root.classList.toggle('krs-collapsed');
        colBtn.querySelector('.krs-collapse-text').textContent = isCol ? '展开' : '收起';
        colBtn.querySelector('.krs-collapse-icon').textContent = isCol ? '▼' : '▲';
        try { localStorage.setItem('KRS_STATUS_COLLAPSED', isCol ? '1' : '0'); } catch (_) {}
        return;
      }
    });
  }
