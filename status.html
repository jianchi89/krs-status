  let mapInitDone = false;
  window.initEmbeddedMap = function () {
    if (mapInitDone) return;
    mapInitDone = true;

    const viewport = document.getElementById('pdr-viewport');
    const canvas = document.getElementById('pdr-canvas');
    const nodesLayer = document.getElementById('pdr-nodes-layer');
    const svgLines = document.getElementById('pdr-svg-lines');
    const factionsLayer = document.getElementById('pdr-factions-layer');
    if (!viewport || !canvas || !nodesLayer) return;

    // 渲染势力大背景
    factionsLayer.innerHTML = PANDORA_MAP_FULL.factions.map(f => `
      <div class="pdr-faction-zone" style="left:${f.x}px; top:${f.y}px; width:${f.w}px; height:${f.h}px; background:${f.color}; border:1.5px dashed ${f.border};">
        <span class="pdr-faction-watermark-cn" style="color:${f.border}">${f.cn}</span>
        <span class="pdr-faction-watermark-en" style="color:${f.border}">${f.en}</span>
        ${f.dlc ? `<span class="pdr-faction-dlc-tag" style="color:${f.border}; border-color:${f.border}">${f.dlc}</span>` : ''}
      </div>
    `).join('');

    const nodeMap = new Map();
    PANDORA_MAP_FULL.nodes.forEach(n => nodeMap.set(n.id, n));

    let svgHtml = '';
    PANDORA_MAP_FULL.connections.forEach(c => {
      const f = nodeMap.get(c.from), t = nodeMap.get(c.to);
      if (f && t) svgHtml += `<line x1="${f.x}" y1="${f.y}" x2="${t.x}" y2="${t.y}" class="${c.type}"></line>`;
    });

    nodesLayer.innerHTML = '';
    PANDORA_MAP_FULL.nodes.forEach(n => {
      const nodeEl = document.createElement('div');
      nodeEl.className = `pdr-node ${n.type}`;
      nodeEl.style.left = `${n.x}px`;
      nodeEl.style.top = `${n.y}px`;
      nodeEl.innerHTML = `<div class="pdr-node-icon-box">${n.icon}</div><span class="pdr-node-label">${n.name}</span>`;

      nodeEl.onclick = (e) => {
        e.stopPropagation();
        selectLocation(n.id);
      };
      nodesLayer.appendChild(nodeEl);

      // 扇形子据点防撞
      if (n.subs && n.subs.length > 0 && n.type !== 'fog') {
        const radius = 118;
        const total = n.subs.length;
        const baseAngleRad = (n.fanAngle !== undefined ? n.fanAngle : 90) * (Math.PI / 180);
        const spreadRad = Math.min(Math.PI * 0.85, (total * 0.28) * Math.PI);

        n.subs.forEach((subName, idx) => {
          const offset = total > 1 ? (idx / (total - 1) - 0.5) * spreadRad : 0;
          const finalAngle = baseAngleRad + offset;
          const sx = n.x + Math.cos(finalAngle) * radius;
          const sy = n.y + Math.sin(finalAngle) * radius;

          svgHtml += `<line x1="${n.x}" y1="${n.y}" x2="${sx}" y2="${sy}" class="sub-link"></line>`;

          const subEl = document.createElement('div');
          subEl.className = 'pdr-subnode';
          subEl.style.left = `${sx}px`;
          subEl.style.top = `${sy}px`;
          subEl.innerHTML = `<span>▫</span><span>${subName}</span>`;
          subEl.onclick = (e) => {
            e.stopPropagation();
            selectLocation(n.id, subName);
          };
          nodesLayer.appendChild(subEl);
        });
      }
    });

    svgLines.innerHTML = svgHtml;

    function selectLocation(nodeId, subName) {
      const node = nodeMap.get(nodeId);
      if (!node) return;
      document.getElementById('pdr-info-name').textContent = subName ? `${node.name} · ${subName}` : node.name;
      document.getElementById('pdr-info-nation').textContent = node.nation;
      document.getElementById('pdr-info-desc').textContent = node.desc;
      document.getElementById('pdr-info-cost').textContent = node.cost;

      const subsBox = document.getElementById('pdr-info-subs');
      if (subsBox) {
        subsBox.innerHTML = (node.subs || []).map(s => `
          <span class="pdr-sub-pill ${s === subName ? 'selected' : ''}" onclick="window.selectPandoraSub('${node.id}', '${s}')">${s}</span>
        `).join('');
      }

      document.getElementById('pdr-btn-set-loc').onclick = async () => {
        const targetLoc = subName ? `${node.name}·${subName}` : node.name;
        await mutateMvuStat(r => { if (!r['世界']) r['世界'] = {}; r['世界']['地点'] = targetLoc.replace('[???] ', ''); });
        renderAll();
      };
    }
    window.selectPandoraSub = (p, s) => selectLocation(p, s);

    // 🌟 缩放平移优化：绝对围绕帝国首都王都 (1450, 1100) 居中校准
    let scale = 0.52;
    const vRect = viewport.getBoundingClientRect();
    const vW = vRect.width || 880;
    const vH = vRect.height || 540;

    let panX = (vW / 2) - (1450 * scale);
    let panY = (vH / 2) - (1100 * scale);

    function update() {
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    /* ═══ 拖动 / 触摸 / 双指缩放（Pointer Events）═══
       原来只绑了 mousedown + window 上的 mousemove：手机上根本不产生 mousemove，
       所以地图拖不动。改用 Pointer Events，并把 move/up 挂在 window 上，
       这样手指移出视口也不会丢事件。

       ⚠️ 这里刻意【不用 setPointerCapture】：
       指针一旦被捕获，浏览器会把随后的 click 派发到捕获元素（也就是 viewport）
       而不是真正被点中的节点，导致地图上的地点节点、缩放按钮全部点不动。
       挂在 window 上同样能实现「拖出边界继续跟手」，且不影响点击。 */
    let sx = 0, sy = 0, dragMoved = 0, pinchStart = 0, pinchScale = 0;
    const ptrs = new Map();
    const ptrArr = () => Array.from(ptrs.values());

    viewport.onpointerdown = (e) => {
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (ptrs.size === 1) {
        dragMoved = 0;
        sx = e.clientX - panX; sy = e.clientY - panY;
      } else if (ptrs.size === 2) {
        const a = ptrArr();
        pinchStart = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
        pinchScale = scale;
        dragMoved = 99;
      }
    };

    function onMapPointerMove(e) {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });

      /* 双指：以两指中点为锚缩放 */
      if (ptrs.size >= 2) {
        const a = ptrArr();
        const dist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
        if (pinchStart > 0) {
          const old = scale;
          scale = Math.max(0.25, Math.min(1.8, pinchScale * (dist / pinchStart)));
          const rect = viewport.getBoundingClientRect();
          const cx = (a[0].x + a[1].x) / 2 - rect.left;
          const cy = (a[0].y + a[1].y) / 2 - rect.top;
          panX = cx - (cx - panX) * (scale / old);
          panY = cy - (cy - panY) * (scale / old);
          update();
        }
        dragMoved = 99;
        return;
      }

      /* 单指 / 鼠标：平移 */
      dragMoved = Math.max(dragMoved, Math.abs(e.clientX - (sx + panX)) + Math.abs(e.clientY - (sy + panY)));
      panX = e.clientX - sx; panY = e.clientY - sy;
      update();
    }

    function onMapPointerUp(e) {
      ptrs.delete(e.pointerId);
      if (ptrs.size < 2) pinchStart = 0;
    }

    window.addEventListener('pointermove', onMapPointerMove);
    window.addEventListener('pointerup', onMapPointerUp);
    window.addEventListener('pointercancel', onMapPointerUp);

    /* 拖完不要误触发节点/子地点的点击（捕获阶段拦下，onclick 就收不到） */
    viewport.addEventListener('click', (e) => {
      if (dragMoved > 8) { e.stopPropagation(); e.preventDefault(); }
      dragMoved = 0;
    }, true);

    viewport.onwheel = (e) => {
      e.preventDefault();
      const factor = 1.15;
      const oldScale = scale;
      if (e.deltaY < 0) scale = Math.min(1.8, scale * factor);
      else scale = Math.max(0.25, scale / factor);

      const rect = viewport.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      panX = mouseX - (mouseX - panX) * (scale / oldScale);
      panY = mouseY - (mouseY - panY) * (scale / oldScale);
      update();
    };

    document.getElementById('pdr-zoom-in').onclick = () => {
      const oldScale = scale; scale = Math.min(1.8, scale * 1.2);
      panX = (vW/2) - ((vW/2) - panX) * (scale / oldScale);
      panY = (vH/2) - ((vH/2) - panY) * (scale / oldScale);
      update();
    };
    document.getElementById('pdr-zoom-out').onclick = () => {
      const oldScale = scale; scale = Math.max(0.25, scale / 1.2);
      panX = (vW/2) - ((vW/2) - panX) * (scale / oldScale);
      panY = (vH/2) - ((vH/2) - panY) * (scale / oldScale);
      update();
    };
    document.getElementById('pdr-zoom-reset').onclick = () => {
      scale = 0.52;
      panX = (vW / 2) - (1450 * scale);
      panY = (vH / 2) - (1100 * scale);
      update();
    };
    
    update();
    selectLocation("王都");
  };

  function init() {
    bindEvents();
    renderAll();
  }

  init();
  try {
    const ev = (window.parent && window.parent.eventOn) ? window.parent : (typeof eventOn === 'function' ? window : null);
    if (ev) {
      ev.eventOn('mag_variable_update_ended', renderAll);
      ev.eventOn('MAG_VARIABLE_UPDATE_ENDED', renderAll);
    }
  } catch(_) {}
})();

/* ── 折叠状态恢复：面板 DOM 由正则重建，每轮生成后都要按存档恢复 ── */
(function () {
  var KEY = 'KRS_STATUS_COLLAPSED';
  function want() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function apply(root) {
    if (!root || root.getAttribute('data-col-applied') === '1') return;
    root.setAttribute('data-col-applied', '1');
    var col = want();
    root.classList.toggle('krs-collapsed', col);
    var btn = root.querySelector('#krs-btn-collapse');
    if (btn) {
      var t = btn.querySelector('.krs-collapse-text');
      var ic = btn.querySelector('.krs-collapse-icon');
      if (t) t.textContent = col ? '展开' : '收起';
      if (ic) ic.textContent = col ? '▼' : '▲';
    }
  }
  function sweep() {
    var list = document.querySelectorAll('.krs-status-root');
    for (var i = 0; i < list.length; i++) apply(list[i]);
  }
  sweep();
  try { new MutationObserver(sweep).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
  var n = 0, t = setInterval(function () { sweep(); if (++n > 20) clearInterval(t); }, 500);
})();

/* ── 一条消息里只保留一个状态面板 ──
   卡里没有任何条目指示 AI 输出 <StatusPlaceHolderImpl/>，它是照开场白模仿的；
   一旦一轮回复里写了两次，正则就会替换出两个面板。这里按「每条 .mes_text 只留第一个」
   收掉多余的，不影响多楼各自的面板。 */
(function krsDedupePanels() {
  var KEEP = ['.krs-status-root', '.custom-krs-status-root'];
  function sweepDup() {
    var texts = document.querySelectorAll('.mes_text');
    for (var i = 0; i < texts.length; i++) {
      var host = texts[i];
      for (var s = 0; s < KEEP.length; s++) {
        var sel = KEEP[s].split(',').join(',');
        var nodes = host.querySelectorAll(sel);
        for (var j = 1; j < nodes.length; j++) {
          try { nodes[j].parentNode.removeChild(nodes[j]); } catch (e) {}
        }
      }
      /* 世界风云的挂载点同理 */
      var wcs = host.querySelectorAll('.krs-wc-root, .custom-krs-wc-root');
      for (var k = 1; k < wcs.length; k++) {
        try { wcs[k].parentNode.removeChild(wcs[k]); } catch (e) {}
      }
    }
  }
  sweepDup();
  try { new MutationObserver(sweepDup).observe(document.body, { childList: true, subtree: true }); } catch (e) {}
  var n = 0, t = setInterval(function () { sweepDup(); if (++n > 25) clearInterval(t); }, 400);
})();

/* ── 玩家切换 persona 时，核心页立绘要跟着换 ──
   酒馆允许存在多个同名 persona（头像不同），切换后页面不会重渲染我们的面板，
   所以这里轮询 persona 头像 URL，一旦变了就把所有面板的核心立绘同步过去。
   只改这一张 <img>，不重渲染整个面板。 */
(function krsWatchPersonaAvatar() {
  var last = '';
  function sync() {
    var url = '';
    try {
      url = (typeof window.__krsUserAvatar === 'function') ? window.__krsUserAvatar() : '';
    } catch (e) { url = ''; }
    if (!url) return;
    var roots = document.querySelectorAll('.krs-status-root, .custom-krs-status-root');
    if (url !== last) {
      last = url;
      for (var i = 0; i < roots.length; i++) {
        var img = roots[i].querySelector('.hero-avatar-img');
        if (img && img.getAttribute('src') !== url) img.setAttribute('src', url);
      }
      return;
    }
    /* 面板可能是后渲染出来的，补一次 */
    for (var j = 0; j < roots.length; j++) {
      var im = roots[j].querySelector('.hero-avatar-img');
      if (im && im.getAttribute('src') !== url) im.setAttribute('src', url);
    }
  }
  sync();
  try { setInterval(sync, 1200); } catch (e) {}
})();
</script>
